version: '3.8'

# Docker Compose configuration for GPU deployment
# Requires nvidia-docker runtime

services:
  ocr-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: easyocr-api:gpu
    container_name: easyocr-api-gpu
    ports:
      - "3600:3600"
    environment:
      - LOG_LEVEL=INFO
      # GPU optimization settings
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    # GPU resource allocation
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
          memory: 4G
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:3600/_health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
