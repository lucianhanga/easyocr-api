version: '3.8'

services:
  ocr-api:
    build:
      context: .
      dockerfile: Dockerfile.rocm
    image: easyocr-api:rocm
    container_name: easyocr-api-rocm
    ports:
      - "3600:3600"
    # AMD ROCm GPU device access
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    # Required for ROCm
    group_add:
      - video
      - render
    # Security options for ROCm
    security_opt:
      - seccomp:unconfined
    # Cap GPU memory (optional, adjust based on your GPU)
    # The MI25 has 16GB VRAM
    environment:
      - HSA_OVERRIDE_GFX_VERSION=9.0.0
      - PYTORCH_ROCM_ARCH=gfx900
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:3600/_health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
